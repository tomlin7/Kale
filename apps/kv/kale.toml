[package]
name = "kale-kv"
version = "0.1.0"
description = "Fast, concurrent in-memory key-value database engine for Kale"
authors = ["Tom Lin <tom@kale-lang.org>"]
license = "MIT"
edition = "2026"
entry = "main.kl"

[dependencies]
std = { path = "../../packages/std" }
net = { path = "../../libs/net" }

[scripts]
start = "kale run main.kl"
build = "kale build main.kl -o ../../bin/kale_kv.exe"

[build]
backend = "llvm"
opt = 2
output = "../../bin/kale_kv.exe"
includes = ["../..", "../../packages/std"]
